name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check Docker Hub Secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "DOCKER_USERNAME is missing"
            exit 1
          fi

          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "DOCKER_PASSWORD is missing"
            exit 1
          fi

          echo "Docker Hub secrets are configured"

      - name: Log In To Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build And Push Docker Image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t chcodeny1234/gateway:latest -t chcodeny1234/gateway:${{ github.sha }} -f ./apps/gateway/Dockerfile --target production --push .
          docker buildx build --platform linux/amd64,linux/arm64 -t chcodeny1234/notification:latest -t chcodeny1234/notification:${{ github.sha }} -f ./apps/notification/Dockerfile --target production --push .
          docker buildx build --platform linux/amd64,linux/arm64 -t chcodeny1234/order:latest -t chcodeny1234/order:${{ github.sha }} -f ./apps/order/Dockerfile --target production --push .
          docker buildx build --platform linux/amd64,linux/arm64 -t chcodeny1234/payment:latest -t chcodeny1234/payment:${{ github.sha }} -f ./apps/payment/Dockerfile --target production --push .
          docker buildx build --platform linux/amd64,linux/arm64 -t chcodeny1234/product:latest -t chcodeny1234/product:${{ github.sha }} -f ./apps/product/Dockerfile --target production --push .
          docker buildx build --platform linux/amd64,linux/arm64 -t chcodeny1234/user:latest -t chcodeny1234/user:${{ github.sha }} -f ./apps/user/Dockerfile --target production --push .
